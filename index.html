<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08091b">
<meta name="google-site-verification" content="fxfr-B-gnBizaAetBEV72rjixynicxPFNtJfJIZ-g">
<title>متجر نسر البرية الرسمي | إكسسوارات الموبايل والكمبيوتر في مصر</title>
<meta name="description" content="متجر نسر البرية الرسمي - إكسسوارات الموبايل والكمبيوتر في مصر.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://antonyos2010.github.io/nasr-albaria/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_EG">
<meta property="og:site_name" content="متجر نسر البرية الرسمي">
<meta property="og:title" content="متجر نسر البرية الرسمي">
<meta property="og:description" content="كل ما تحتاجه في عالم الهواتف والكمبيوتر">
<meta property="og:url" content="https://antonyos2010.github.io/nasr-albaria/">
<meta property="og:image" content="https://antonyos2010.github.io/nasr-albaria/store-design.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#08091b;--panel:#11142b;--panel2:#191d3b;
 --text:#fff;--muted:#aab5d2;--purple:#a600ff;
 --blue:#087bff;--cyan:#00d9ff;--gold:#ffc52e;
 --border:rgba(0,196,255,.23);--danger:#ff5364;--success:#24d69a
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
 font-family:'Cairo',sans-serif;color:var(--text);overflow-x:hidden;
 padding-bottom:85px;
 background:radial-gradient(ellipse at 10% 5%,#19104a 0,transparent 35%),
 radial-gradient(ellipse at 90% 25%,#071b48 0,transparent 35%),var(--bg)
}
body.light{--bg:#f2f4fb;--panel:#fff;--panel2:#e9edfa;--text:#17172a;--muted:#65708a;--border:rgba(75,75,150,.2);background:#f2f4fb}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}a{text-decoration:none;color:inherit}
.container{width:min(1250px,94%);margin:auto}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:30;background:rgba(7,8,23,.95);backdrop-filter:blur(15px);border-bottom:1px solid var(--border)}
body.light header{background:rgba(255,255,255,.94)}
.header-inner{min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:12px;direction:ltr}
.brand{display:flex;align-items:center;gap:9px;direction:rtl}
.brand-logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;font-size:26px;background:linear-gradient(145deg,#092b78,#160b42);border:1px solid var(--cyan)}
.brand h1{font-size:19px;font-weight:900}
.brand small{display:block;color:var(--muted);font-size:9px}
.header-actions{display:flex;align-items:center;gap:8px;direction:rtl}
.icon-btn{width:43px;height:43px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--text);font-size:20px}
.theme-toggle{width:57px;height:30px;border-radius:30px;border:1px solid var(--border);background:var(--panel2);position:relative}
.theme-toggle:after{content:"🌙";position:absolute;right:3px;top:2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:#28345d;transition:.25s}
body.light .theme-toggle:after{content:"☀️";right:28px;background:#ffdb7c}
.cart-count{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#111;font-size:10px}

.hero{margin:17px auto 24px;overflow:hidden;border:1px solid #335aff;border-radius:19px;background:#08091b;box-shadow:0 0 25px #124cff33}
.hero img{display:block;width:100%;height:auto;max-height:390px;object-fit:cover}
.hero-fallback{padding:45px 15px;text-align:center;background:linear-gradient(140deg,#10133a,#081a42)}
.hero-fallback h2{font-size:38px;color:var(--gold)}
.intro{text-align:center;margin:20px 0 25px}
.intro h2{font-size:32px;font-weight:900}
.intro h2 span{color:var(--gold)}
.intro p{color:var(--gold);font-size:15px;font-weight:800;margin-top:8px}
.benefits{display:flex;flex-direction:column;gap:9px;width:min(280px,85%);margin:20px 0 20px auto}
.benefit{display:flex;align-items:center;justify-content:flex-start;gap:12px;background:var(--panel);border:1px solid var(--border);padding:10px 14px;border-radius:12px}
.benefit span{font-size:23px;color:var(--purple)}
.benefit strong{font-size:13px}
.hero-buttons{display:flex;justify-content:flex-start;align-items:center;gap:10px;flex-wrap:wrap}
.hero-btn{min-width:145px;padding:11px 17px;border-radius:30px;font-weight:900;font-size:13px}
.hero-btn.primary{background:var(--purple);color:#fff;border:1px solid var(--purple)}
.hero-btn.secondary{background:#08091b;color:#fff;border:1px solid #08091b}

.section-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:30px 0 15px}
.section-heading h2{font-size:19px;font-weight:900}
.section-heading small{color:var(--muted);font-size:11px}
.text-link{color:var(--purple);font-size:12px;font-weight:900;background:none;border:0}

.marquee-wrap{overflow:hidden;border:1px solid var(--border);border-radius:15px;background:var(--panel);padding:14px 0;direction:ltr}
.marquee{display:flex;width:max-content;animation:move 32s linear infinite;will-change:transform}
.marquee:hover{animation-play-state:paused}
.marquee-track{display:flex;flex-shrink:0;gap:14px;padding-right:14px}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.best-item{width:235px;min-width:235px;min-height:100px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;background:var(--panel2);border:1px solid var(--border);direction:rtl}
.best-icon{width:76px;height:76px;min-width:76px;display:grid;place-items:center;border-radius:11px;background:#101c45;font-size:25px;overflow:hidden}
.best-icon img{width:100%;height:100%;object-fit:cover}
.best-item strong{display:block;font-size:13px;margin-bottom:7px}
.best-item small{display:block;color:var(--gold);font-size:13px;font-weight:900}

.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:30px 0}
.feature{min-height:75px;display:flex;align-items:center;gap:10px;padding:14px 12px;border-radius:13px;background:#08091b;border:1px solid #24213c;color:#fff}
.feature-icon{font-size:25px;color:var(--purple)}
.feature b{display:block;color:#fff;font-size:12px}

.categories-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.category-btn{min-height:90px;padding:12px 5px;border-radius:14px;color:var(--text);background:var(--panel);border:1px solid var(--border);font-size:11px;font-weight:800}
.category-btn .cat-icon{display:block;font-size:25px;margin-bottom:6px}
.category-btn.active,.category-btn:hover{border-color:var(--cyan);box-shadow:0 0 12px #00cfff44}

.products-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.product-card{overflow:hidden;border-radius:15px;background:var(--panel);border:1px solid var(--border);transition:.2s}
.product-card:hover{border-color:var(--cyan);transform:translateY(-3px)}
.product-image{height:150px;display:grid;place-items:center;position:relative;font-size:50px;background:linear-gradient(145deg,#192d5d,#10132a);border-bottom:1px solid var(--border);overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover}
.product-badge{position:absolute;top:8px;right:8px;padding:4px 7px;border-radius:7px;background:var(--gold);color:#111;font-size:9px;font-weight:900}
.product-info{padding:11px;display:flex;flex-direction:column}
.product-category{font-size:10px;color:var(--cyan)}
.product-info h3{font-size:13px;margin:5px 0 7px}
.product-old{display:block;order:1;font-size:11px;color:#9299ad;text-decoration:line-through;margin-bottom:2px}
.product-price{order:2;font-size:18px;font-weight:900;color:var(--gold)}
.stock-label{font-size:10px;color:var(--muted);margin-top:5px}
.add-btn{width:100%;margin-top:10px;padding:9px;border-radius:30px;border:1px solid #a600ff;background:linear-gradient(90deg,#a600ff,#6411a4);color:white;font-weight:800;font-size:11px}
.add-btn:disabled{opacity:.5;cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px 10px}

footer{margin-top:40px;padding:30px 0;text-align:center;background:var(--panel);border-top:1px solid var(--border)}
footer h2{font-size:22px;color:var(--gold)}
footer p{font-size:11px;color:var(--muted);margin-top:7px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:35;display:flex;justify-content:space-around;align-items:center;padding:8px 3px calc(8px + env(safe-area-inset-bottom));background:rgba(8,9,27,.97);border-top:1px solid var(--border);backdrop-filter:blur(15px)}
body.light .bottom-nav{background:rgba(255,255,255,.97)}
.nav-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:10px;font-weight:800;padding:3px}
.nav-btn span{font-size:20px}
.nav-btn.active{color:var(--cyan)}

.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:40}
.overlay.show{display:block}
.cart-panel{position:fixed;top:0;left:0;width:min(430px,100%);height:100%;overflow-y:auto;padding:18px;background:var(--panel);z-index:50;border-right:1px solid var(--cyan);transform:translateX(-105%);transition:.3s}
.cart-panel.show{transform:translateX(0)}
.cart-head,.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cart-head{border-bottom:1px solid var(--border);padding-bottom:13px}
.close-btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:8px}
.cart-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:13px 0}
.cart-item h4{font-size:12px}
.cart-item small{color:var(--gold)}
.qty-controls{display:flex;align-items:center;gap:8px;margin-top:7px}
.qty-controls button{width:25px;height:25px;border:0;border-radius:5px;background:#243568;color:white}
.remove-btn{color:#ff7777;background:none!important;width:auto!important}
.cart-total{display:flex;justify-content:space-between;padding:17px 0;font-weight:900}
.cart-total strong{color:var(--gold)}
.checkout-btn,.primary-btn{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(90deg,#087bff,#8a16d9);color:white;font-weight:900}
.note{font-size:10px;color:var(--muted);line-height:1.8;margin-top:10px}

.modal-backdrop{display:none;position:fixed;inset:0;z-index:100;background:#000c;backdrop-filter:blur(7px);padding:15px;overflow-y:auto;align-items:center;justify-content:center}
.modal-backdrop.show{display:flex}
.modal-card{width:min(650px,100%);margin:auto;padding:22px;border:1px solid var(--border);border-radius:19px;background:var(--panel);max-height:92vh;overflow-y:auto}
.modal-card.wide{width:min(950px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}
.modal-head h2{font-size:19px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);outline:none;font-size:12px}
.field textarea{min-height:75px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan)}
.message{padding:10px;border-radius:9px;margin:10px 0;font-size:11px;line-height:1.8;display:none}
.message.show{display:block}
.message.error{background:#451b2b;color:#ffd0d0}
.message.success{background:#123c31;color:#c6ffdf}
.secondary-btn{padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);color:var(--text);font-size:11px;font-weight:800}
.danger-btn{padding:9px;border:1px solid #a93d57;border-radius:9px;background:#451b2b;color:#ffd0d0;font-size:11px;font-weight:800}
.admin-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.admin-tab{border:1px solid var(--border);border-radius:9px;background:var(--panel2);color:var(--text);padding:9px 12px;font-size:11px;font-weight:800}
.admin-tab.active{background:#164c91;border-color:var(--cyan);color:white}
.admin-list{display:grid;gap:9px}
.admin-item{padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-item h4{font-size:12px}
.admin-item small{font-size:10px;color:var(--muted)}
.admin-actions{display:flex;gap:5px;flex-wrap:wrap}
.order-status{padding:6px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:10px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}
.auth-tab{padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:800}
.auth-tab.active{background:#164c91;color:white}
.auth-footer{font-size:10px;color:var(--muted);text-align:center;margin-top:14px}
.google-btn{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:white;color:#222;font-weight:900;margin-top:10px}
.order-card{padding:13px;border:1px solid var(--border);background:var(--panel2);border-radius:11px;margin-bottom:10px}
.order-card p{font-size:11px;color:var(--muted);margin:4px 0}
.order-card strong{color:var(--gold)}
.loading{text-align:center;padding:30px;color:var(--muted)}

@media(min-width:650px){.products-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.categories-grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1100px){.products-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}.product-image{height:125px;font-size:38px}.product-info{padding:8px}.product-info h3{font-size:11px}.product-price{font-size:13px}.categories-grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:450px){.brand h1{font-size:16px}.brand-logo{width:39px;height:39px}.header-inner{min-height:65px}.intro h2{font-size:25px}.product-image{height:125px}.form-grid{grid-template-columns:1fr}.modal-card{padding:16px}.nav-btn{font-size:9px}.nav-btn span{font-size:18px}.best-item{width:210px;min-width:210px}}
</style>
</head>
