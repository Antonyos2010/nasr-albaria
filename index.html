<style data-nasr-core="1">
:root{
 --bg:#08091b;--panel:#11142b;--panel2:#191d3b;
 --text:#fff;--muted:#aab5d2;--purple:#a600ff;
 --blue:#087bff;--cyan:#00d9ff;--gold:#ffc52e;
 --border:rgba(0,196,255,.23);--danger:#ff5364;
 --success:#24d69a;
 /* لوحة ألوان الإطارات */
 --c1:#00d9ff;--c2:#a600ff;--c3:#ff4d8d;--c4:#ffc52e;--c5:#24d69a;--c6:#087bff;
 --num:#fff;      /* لون الأسعار والأرقام */
 --red:#ff2d46;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
 font-family:'Cairo',sans-serif;color:var(--text);
 background:radial-gradient(ellipse at 10% 5%,#19104a 0,transparent 35%),
 radial-gradient(ellipse at 90% 25%,#071b48 0,transparent 35%),var(--bg);
 overflow-x:hidden;padding-bottom:88px;
}
body.light{
 --bg:#f2f4fb;--panel:#fff;--panel2:#e9edfa;
 --text:#17172a;--muted:#65708a;--border:rgba(75,75,150,.2);
 --num:#000;
 background:#f2f4fb;
}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer;transition:transform .15s,filter .15s,border-color .2s,background .2s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{
 outline:2px solid var(--c1);outline-offset:2px;
}
a{text-decoration:none;color:inherit}
.container{width:min(1250px,94%);margin:auto}
.hidden{display:none!important}
.ci{display:block;flex-shrink:0}

/* رأس الموقع */
header{
 position:sticky;top:0;z-index:30;
 background:rgba(7,8,23,.96);backdrop-filter:blur(15px);
 border-bottom:2px solid var(--c2);
}
body.light header{background:rgba(255,255,255,.95)}
.header-inner{
 min-height:72px;display:flex;align-items:center;
 justify-content:space-between;gap:12px;direction:rtl;
}
.brand{display:flex;align-items:center;gap:9px;direction:rtl}
.brand-logo{
 width:46px;height:46px;display:grid;place-items:center;
 border-radius:50%;overflow:hidden;padding:0;flex-shrink:0;
 background:#fff;
 border:2px solid var(--c1);box-shadow:0 4px 14px rgba(0,217,255,.22);
}
.brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.brand h1{font-size:clamp(16px,4.2vw,21px);font-weight:900;line-height:1.22;letter-spacing:.1px}
.brand small{display:block;color:var(--muted);font-size:9.5px;font-weight:700}
.header-actions{display:flex;align-items:center;gap:9px;direction:ltr}
.icon-btn{
 width:43px;height:43px;border:2px solid var(--c3);
 border-radius:13px;background:var(--panel);color:var(--text);
 font-size:19px;position:relative;
}
.icon-btn:hover{box-shadow:0 0 12px #ff4d8d66}
.cart-count{
 position:absolute;top:-6px;right:-6px;
 display:grid;place-items:center;min-width:19px;height:19px;padding:0 4px;
 border-radius:20px;background:var(--gold);color:#000;font-size:10px;font-weight:900;
}
.theme-control{display:flex;align-items:center;gap:5px}
.theme-label{font-size:10px;color:var(--muted)}
.theme-toggle{
 width:66px;height:34px;border-radius:34px;padding:0;direction:ltr;
 border:2px solid var(--c1);position:relative;overflow:hidden;
 background:linear-gradient(135deg,#5ec3ff,#2f7bff);transition:background .35s;
 box-shadow:inset 0 2px 6px #0003,0 0 12px #087bff44;
}
.theme-toggle:before{
 content:"";position:absolute;right:11px;top:9px;width:18px;height:6px;
 border-radius:6px;background:#fff9;box-shadow:-6px 9px 0 #fff6;transition:.35s;
}
.theme-toggle .tt-thumb{
 position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
 display:grid;place-items:center;background:#fff;color:#f59e0b;
 box-shadow:0 2px 6px #0004;
 transition:left .35s cubic-bezier(.4,1.4,.5,1),background .35s,color .35s;
}
.theme-toggle .tt-thumb svg{width:15px;height:15px}
.theme-toggle .i-moon{display:none}
body:not(.light) .theme-toggle{background:linear-gradient(135deg,#1b1f4a,#0b0d24)}
body:not(.light) .theme-toggle:before{
 right:auto;left:11px;top:10px;width:3px;height:3px;border-radius:50%;
 background:#fff;box-shadow:9px 6px 0 #fff9,3px 13px 0 #fff7,16px -1px 0 #fff6;
}
body:not(.light) .theme-toggle .tt-thumb{left:34px;background:#e8ecff;color:#4b5cd6}
body:not(.light) .theme-toggle .i-sun{display:none}
body:not(.light) .theme-toggle .i-moon{display:block}

/* الرئيسية */
.hero{
 margin:15px auto 18px;overflow:hidden;
 border:2px solid var(--c6);border-radius:19px;
 background:#08091b;box-shadow:0 0 25px #124cff33;
}
.hero img{display:block;width:100%;height:auto;max-height:390px;object-fit:cover}
.hero-fallback{
 padding:45px 15px;text-align:center;
 background:linear-gradient(140deg,#10133a,#081a42);
}
.hero-fallback h2{font-size:38px;color:var(--gold)}
.intro{text-align:center;margin:18px 0 22px}
.intro h2{font-size:31px;font-weight:900}
.intro p{color:var(--muted);font-size:14px;margin-top:7px}
.tagline{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:7px}
.tg-main{font-size:20px;font-weight:900;line-height:1.7}
.tg-sub{
 display:flex;align-items:center;gap:10px;font-size:14px;font-weight:900;
 letter-spacing:.3px;
}
.tg-sub:before,.tg-sub:after{
 content:"";width:42px;height:2px;border-radius:2px;
 background:linear-gradient(90deg,transparent,var(--cyan),var(--purple));
}
.tg-sub:after{transform:scaleX(-1)}
.intro-content{
 display:flex;flex-direction:column;align-items:flex-start;
 gap:15px;margin-top:20px;
}
.benefits{
 display:flex;flex-direction:column;align-items:flex-start;
 gap:8px;width:100%;max-width:260px;
}
.benefit{
 display:flex;align-items:center;gap:10px;width:100%;
 background:var(--panel);border:1.5px solid var(--bc,var(--c1));
 padding:7px 12px;border-radius:12px;
}
.benefit span{display:grid;place-items:center;width:34px;height:34px}
.benefit strong{font-size:13px}
.hero-buttons{display:flex;gap:9px;flex-wrap:wrap;width:100%}
.hero-btn{
 min-width:145px;padding:11px 17px;border-radius:30px;
 font-weight:900;font-size:13px;
 display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.hero-btn.primary{background:var(--purple);color:#fff;border:2px solid var(--c3)}
.hero-btn.secondary{background:#08091b;color:#fff;border:2px solid var(--c4)}
.hero-btn:hover{filter:brightness(1.15);transform:translateY(-2px)}
body.light .hero-btn.secondary{background:#17172a}
.features{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;margin:25px 0 30px;
}
.feature{
 display:flex;align-items:center;gap:10px;min-height:70px;
 padding:12px 10px;border-radius:13px;
 background:#080808;border:2px solid var(--bc,var(--c1));color:#fff;
}
.feature-icon{
 display:grid;place-items:center;width:50px;height:50px;flex-shrink:0;
 border-radius:14px;
 background:radial-gradient(circle at 30% 25%,#ffffff22,#ffffff06);
 border:1px solid var(--bc,var(--c1));
}
.feature b{display:block;font-size:12px}

/* العناوين */
.section-heading{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;margin:28px 0 14px;
}
.section-heading h2{font-size:19px;font-weight:900}
.section-heading small{color:var(--muted);font-size:11px}
.text-link{font-size:12px;font-weight:900;background:none;border:0;padding:6px 4px}

/* الأكثر مبيعًا: شريط مستمر من الشمال إلى اليمين بدون رجوع */
.marquee-wrap{
 overflow:hidden;border:2px solid var(--c4);direction:ltr;
 border-radius:15px;background:var(--panel);
 padding:16px 0;
}
.marquee{
 display:flex;width:max-content;
 animation:marqueeScroll 90s linear infinite;
 will-change:transform;backface-visibility:hidden;transform:translate3d(0,0,0);
}
@media(hover:hover){.marquee:hover{animation-play-state:paused}}
.marquee-track{
 display:flex;flex-shrink:0;align-items:stretch;
 gap:12px;padding-left:12px;
}
@keyframes marqueeScroll{
 from{transform:translate3d(-50%,0,0)}
 to{transform:translate3d(0,0,0)}
}
.best-item{
 width:200px;flex:0 0 200px;min-height:0;display:flex;direction:rtl;cursor:pointer;
 flex-direction:column;align-items:stretch;text-align:center;
 gap:6px;padding:10px;
 border-radius:12px;background:var(--panel2);
 border:2px solid var(--bc,var(--c1));
}
.best-item:hover{box-shadow:0 0 14px color-mix(in srgb,var(--bc,var(--c1)) 45%,transparent)}
.best-icon{
 width:100%;height:125px;flex-shrink:0;
 display:grid;place-items:center;border-radius:12px;
 background:linear-gradient(145deg,#fff,#eef1fb);font-size:28px;overflow:hidden;
}
.best-icon img{width:100%;height:100%;object-fit:contain}
.best-item strong{
 display:block;font-size:12px;line-height:1.6;
 overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.best-item small:not(.best-disc){display:block;font-size:14px;font-weight:900}
.best-item .add-btn{margin-top:4px}

/* الأقسام */
.categories-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
}
.category-btn{
 min-height:200px;padding:16px 12px;border-radius:26px;
 color:var(--text);background:var(--panel);
 border:2px solid var(--bc,var(--c1));font-size:15px;font-weight:900;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.category-btn .cat-icon{display:block;width:100%;font-size:58px;margin-bottom:10px;-webkit-text-fill-color:initial}
.category-btn .cat-icon img{
 width:100%;height:132px;object-fit:contain;padding:6px;border-radius:16px;
 background:linear-gradient(145deg,#fff,#eef1fb);display:block;
}
.category-btn .cat-name{display:block;line-height:1.5;text-align:center}
.category-btn:hover{box-shadow:0 8px 24px color-mix(in srgb,var(--bc,var(--c1)) 42%,transparent);transform:translateY(-3px)}
body.light .category-btn,body.light .product-card,body.light .benefit,body.light .marquee-wrap{box-shadow:0 8px 24px rgba(15,23,42,.06)}
body.light .category-btn:hover,body.light .product-card:hover{box-shadow:0 14px 32px color-mix(in srgb,var(--bc,var(--c1)) 24%,rgba(15,23,42,.12))}

/* المنتجات */
.products-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;
}
.product-card{
 overflow:hidden;border-radius:18px;background:var(--panel);cursor:pointer;
 border:2px solid var(--bc,var(--c1));transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease;min-width:0;
 display:flex;flex-direction:column;
}
.product-card:hover{box-shadow:0 10px 26px color-mix(in srgb,var(--bc,var(--c1)) 42%,transparent);transform:translateY(-3px)}
.product-image{
 height:192px;display:grid;place-items:center;
 position:relative;font-size:56px;
 background:linear-gradient(145deg,#fff,#eef1fb);
 border-bottom:2px solid var(--bc,var(--c1));overflow:hidden;
}
.product-image img{width:100%;height:100%;object-fit:contain}
.product-badge{
 position:absolute;top:8px;right:8px;padding:4px 7px;
 border-radius:7px;background:var(--gold);color:#000;
 font-size:9px;font-weight:900;z-index:1;
}
.product-info{padding:13px;display:flex;flex-direction:column;flex:1}
.product-category{font-size:11px;font-weight:800;color:var(--cyan)}
.product-info h3{font-size:14px;font-weight:800;margin:6px 0 8px;line-height:1.65;min-height:44px}
.price-area{display:flex;flex-direction:column;gap:1px}
.product-old{display:block;font-size:11.5px;text-decoration:line-through;min-height:18px}
.product-price{font-size:18px;font-weight:900}
.stock-label{font-size:11px;color:var(--muted);margin-top:5px;min-height:17px}
.stock-label.low{color:var(--red);font-weight:900}
.product-info .add-btn,.product-info .add-row{margin-top:auto}
.add-btn{
 width:100%;margin-top:10px;padding:11px 10px;border-radius:25px;
 border:0;background:linear-gradient(135deg,#19c3ff,#0a8fe0);
 color:#fff;font-weight:900;font-size:12.5px;
 box-shadow:0 4px 12px #0a8fe044;
}
.add-btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.add-btn:disabled{
 background:linear-gradient(135deg,#ff4b5f,#d6162f);color:#fff;
 opacity:1;cursor:not-allowed;box-shadow:0 4px 12px #d6162f44;
}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px 10px}
.empty-note{
 text-align:center;color:var(--muted);padding:18px 10px;font-size:13px;
 line-height:1.9;font-weight:700;
}

/* الصفحات الداخلية */
.page-top{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.back-btn{
 width:42px;height:42px;border-radius:12px;border:2px solid var(--c4);
 background:var(--panel);color:var(--text);font-size:18px;flex-shrink:0;
}
.back-btn:hover{box-shadow:0 0 12px #ffc52e66}
.page-top h2{font-size:20px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-box{position:relative;margin-bottom:14px}
.search-row{
 display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;
 border:2px solid var(--c3);border-radius:14px;background:var(--panel);
}
.search-row:focus-within{border-color:var(--c1)}
.search-row input{
 flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);
 font-size:14px;padding:8px 4px;
}
.search-row button{
 border:0;border-radius:10px;padding:9px 16px;font-weight:900;font-size:12px;color:#fff;
 background:linear-gradient(90deg,#087bff,#8a16d9);
}
.search-row button:hover{filter:brightness(1.12)}
.suggest{
 position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:25;
 border:2px solid var(--c6);border-radius:16px;overflow:hidden;
 background:var(--panel);box-shadow:0 16px 36px #0007;
}
.suggest button.sg-row{
 display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;
 padding:13px 16px;border:0;border-bottom:1px solid var(--border);
 background:none;color:var(--text);font-size:14px;font-weight:800;line-height:1.65;
}
.suggest button.sg-row:last-child{border-bottom:0}
.suggest button.sg-row:hover{background:var(--panel2)}
.suggest button.sg-row .sg-txt{flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest button.sg-row .sg-tag{font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0}

/* صفحة المنتج الاحترافية */
.pd{display:grid;grid-template-columns:1fr;gap:22px;margin-top:8px}
.pd-img-wrap{position:relative}
.pd-img{
 aspect-ratio:1/1;max-height:560px;width:100%;border-radius:24px;overflow:hidden;
 background:radial-gradient(circle at center,#ffffff 35%,#e8edf9 100%);border:2.5px solid var(--c1);
 display:grid;place-items:center;font-size:100px;position:relative;cursor:zoom-in;
 box-shadow:0 16px 40px #0004;
}
.pd-img img{width:100%;height:100%;object-fit:contain;padding:16px;box-sizing:border-box;transition:transform .28s ease}
.pd-img:hover img{transform:scale(1.03)}
.pd-zoom-hint{
 position:absolute;bottom:12px;left:12px;z-index:2;padding:6px 13px;border-radius:999px;
 background:rgba(8,9,27,.8);color:#fff;font-size:11px;font-weight:800;
 border:1px solid rgba(255,255,255,.22);pointer-events:none;
}
.pd-badge-off{
 position:absolute;top:14px;right:14px;z-index:2;padding:6px 14px;border-radius:999px;
 background:linear-gradient(135deg,#ff3b5c,#c8002b);color:#fff;font-size:12px;font-weight:900;
 box-shadow:0 6px 16px #ff3b5c55;
}
.pd-info{
 display:flex;flex-direction:column;gap:12px;background:var(--panel);
 border:1.5px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 10px 30px #0002;
}
.pd-cat{
 display:inline-block;align-self:flex-start;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:900;
 background:#087bff22;color:var(--cyan);border:1.5px solid var(--c1);
}
.pd-info h2{font-size:24px;font-weight:900;line-height:1.55;margin:0}
.pd-price-box{
 display:flex;align-items:center;gap:12px;flex-wrap:wrap;
 padding:14px 16px;border-radius:18px;background:var(--panel2);border:1.5px solid var(--border);
}
.pd-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0}
.pd-price strong{font-size:32px;font-weight:900;color:var(--num)}
.pd-price del{font-size:16px}
.pd-off{padding:4px 11px;border-radius:999px;background:#24d69a;color:#04251a;font-size:12px;font-weight:900}
.pd-save{padding:4px 12px;border-radius:999px;background:#24d69a22;border:1px solid #24d69a88;color:#12b881;font-size:12px;font-weight:900}
.pd-stock-badge{
 display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
 padding:8px 16px;border-radius:999px;font-size:13px;font-weight:900;line-height:1.6;
}
.pd-stock-badge.in{background:#16a34a20;border:1.5px solid #16a34a80;color:#24d69a}
.pd-stock-badge.low{background:#dc262624;border:1.5px solid #dc2626;color:#ff4d61}
.pd-stock-badge.out{background:#dc2626;border:1.5px solid #dc2626;color:#fff}
.pd-actions{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0}
.pd-actions .pd-add{width:auto;flex:1 1 180px;padding:14px 18px;margin-top:0;font-size:14.5px}
.pd-buy-now{
 flex:1 1 160px;padding:14px 18px;border-radius:999px;border:0;
 background:linear-gradient(135deg,#8b3dff,#5b1fb5);color:#fff;font-weight:900;font-size:14.5px;
 box-shadow:0 6px 18px #8b3dff55;
}
.pd-buy-now:hover{filter:brightness(1.1);transform:translateY(-1px)}
.pd-desc-card{padding:16px;border-radius:18px;background:var(--panel2);border:1.5px solid var(--border)}
.pd-desc-card h3{font-size:15px;font-weight:900;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pd-desc{color:var(--muted);font-size:13.5px;line-height:2;white-space:pre-line}
.pd-perks{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pd-perks span{
 padding:8px 14px;border-radius:999px;font-size:12px;font-weight:800;
 border:1.5px solid var(--bc,var(--c1));background:var(--panel2);
}
.pd-zoom-ov{
 position:fixed;inset:0;z-index:2600;background:rgba(4,6,18,.94);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 display:flex;align-items:center;justify-content:center;padding:18px;animation:pmFade .2s ease;
}
.pd-zoom-ov img{max-width:96vw;max-height:88dvh;object-fit:contain;border-radius:18px;background:#fff;padding:10px;box-shadow:0 24px 70px #000}
.pd-zoom-x{
 position:fixed;top:16px;left:16px;width:44px;height:44px;border-radius:50%;border:2px solid #fff;
 background:#000;color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;cursor:pointer;
}
.rel-heading h2{display:inline-flex;align-items:center;gap:10px}
.rel-ic{width:28px;height:28px;flex-shrink:0;display:block}

/* التذييل والتنقل */
footer{
 margin-top:40px;padding:30px 0;text-align:center;
 background:var(--panel);border-top:2px solid var(--c2);
}
footer h2{font-size:22px}
footer p{font-size:11px;color:var(--muted);margin-top:7px}
.bottom-nav{
 position:fixed;bottom:0;left:0;right:0;z-index:35;
 display:flex;justify-content:space-around;align-items:center;
 padding:8px 3px calc(8px + env(safe-area-inset-bottom));
 background:rgba(8,9,27,.97);border-top:2px solid var(--c5);
 backdrop-filter:blur(15px);
}
body.light .bottom-nav{background:rgba(255,255,255,.97)}
.nav-btn{
 flex:1;display:flex;flex-direction:column;align-items:center;
 gap:2px;border:0;background:none;color:var(--muted);
 font-size:10px;font-weight:800;padding:3px;white-space:nowrap;position:relative;
}
.nav-btn span{font-size:20px;transition:transform .2s}
.nav-btn.active span:first-child{transform:translateY(-3px) scale(1.18)}
.nav-btn .nav-badge{
 position:absolute;top:-2px;left:calc(50% + 4px);
 display:grid;place-items:center;min-width:17px;height:17px;padding:0 4px;
 border-radius:20px;background:var(--gold);color:#000;font-size:10px;font-weight:900;
 -webkit-text-fill-color:#000;
}

/* السلة */
.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:40}
.overlay.show{display:block}
.cart-panel{
 position:fixed;top:0;left:0;width:min(430px,100%);
 height:100%;overflow-y:auto;padding:18px;
 background:var(--panel);z-index:50;border-right:2px solid var(--c1);
 transform:translateX(-105%);transition:.3s;
}
.cart-panel.show{transform:translateX(0)}
.cart-head,.row-between{
 display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.cart-head{border-bottom:2px solid var(--c3);padding-bottom:13px}
.close-btn{
 border:2px solid var(--c3);background:var(--panel2);
 color:var(--text);padding:8px 12px;border-radius:9px;font-weight:800;
}
.close-btn:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.cart-item{
 display:flex;justify-content:space-between;gap:10px;
 border-bottom:2px dashed var(--bc,var(--c5));padding:13px 0;
}
.cart-item h4{font-size:12px}
.cart-item small{font-weight:900}
.qty-controls{display:flex;align-items:center;gap:8px;margin-top:7px}
.qty-controls button{
 width:32px;height:32px;border:0;border-radius:8px;font-size:16px;font-weight:900;
 background:linear-gradient(135deg,#19c3ff,#0a8fe0);color:white;
}
.qty-controls .remove-btn{
 color:#fff;background:linear-gradient(135deg,#ff4b5f,#d6162f);
 width:auto;padding:0 12px;font-size:11px;
}
.cart-total{display:flex;justify-content:space-between;padding:17px 0;font-weight:900}
.cart-total strong{font-size:17px}
.checkout-btn,.primary-btn{
 width:100%;padding:13px;border:0;border-radius:12px;
 background:linear-gradient(90deg,#087bff,#8a16d9);
 color:white;font-weight:900;font-size:13px;
}
.checkout-btn:hover:not(:disabled),.primary-btn:hover:not(:disabled){filter:brightness(1.12)}
.checkout-btn:disabled,.primary-btn:disabled{opacity:.55;cursor:not-allowed}
.note{font-size:10px;color:var(--muted);line-height:1.8;margin-top:10px}

/* النوافذ */
.modal-backdrop{
 display:none;position:fixed;inset:0;z-index:100;
 background:#000c;backdrop-filter:blur(7px);padding:15px;
 overflow-y:auto;align-items:center;justify-content:center;
}
.modal-backdrop.show{display:flex}
.modal-card{
 width:min(650px,100%);margin:auto;padding:22px;
 border:2px solid var(--c2);border-radius:19px;
 background:var(--panel);max-height:92vh;overflow-y:auto;
}
.modal-card.wide{width:min(950px,100%)}
.modal-head{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;margin-bottom:17px;
}
.modal-head h2{font-size:19px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}
.field input,.field textarea,.field select{
 width:100%;padding:11px;border:2px solid var(--c6);
 border-radius:10px;background:var(--bg);color:var(--text);
 outline:none;font-size:13px;transition:border-color .2s,box-shadow .2s;
}
.field input[type=checkbox]{width:auto;margin-inline-end:6px;accent-color:var(--c5)}
.field textarea{min-height:75px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--c1);box-shadow:0 0 0 3px #00d9ff33}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.message{
 padding:10px;border-radius:9px;margin:10px 0;
 font-size:11px;line-height:1.8;display:none;
}
.message.show{display:block}
.message.error{background:#451b2b;color:#ffd0d0;border:1.5px solid var(--danger)}
.message.success{background:#123c31;color:#c6ffdf;border:1.5px solid var(--c5)}
.secondary-btn{
 padding:10px 12px;border:2px solid var(--c1);border-radius:9px;
 background:var(--panel2);color:var(--text);font-size:11px;font-weight:800;
}
.secondary-btn:hover{background:var(--c6);color:#fff;border-color:var(--c6)}
.danger-btn{
 padding:10px 12px;border:2px solid var(--danger);border-radius:9px;
 background:#451b2b;color:#ffd0d0;font-size:11px;font-weight:800;
}
.danger-btn:hover{background:var(--danger);color:#fff}

}

}

}

}

/* لوحة الإدارة */

}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}

 background:var(--panel2);position:relative;overflow:hidden;
}

.sub-title{font-size:14px;font-weight:900;margin:14px 0 10px}

.sub-title.bad{color:#ff7777}
.admin-item .meta{display:flex;align-items:center;gap:10px;flex:1;min-width:0}

.thumb{

}

.pill.off{background:#451b2b;color:#ffd0d0}

.search-input{

}

 width:100%;max-height:230px;object-fit:cover;border-radius:14px;

}

 position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3500;

@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.toast-ok{background:#16a34a;color:#fff;border:2px solid #16a34a;border-radius:999px;padding:12px 28px;font-size:14px;text-align:center;box-shadow:0 10px 30px #0006}

/* ألوان الإطارات المتنوعة: كل عنصر في مجموعة بلون مختلف */

:is(.products-grid>*,.categories-grid>*,.marquee-track>*,.benefits>*,.features>*,.stats-grid>*,.admin-list>*,.pd-perks>*,#ordersList>*,#cartItems>*):nth-child(6n+2){--bc:var(--c2)}
:is(.products-grid>*,.categories-grid>*,.marquee-track>*,.benefits>*,.features>*,.stats-grid>*,.admin-list>*,.pd-perks>*,#ordersList>*,#cartItems>*):nth-child(6n+3){--bc:var(--c3)}
:is(.products-grid>*,.categories-grid>*,.marquee-track>*,.benefits>*,.features>*,.stats-grid>*,.admin-list>*,.pd-perks>*,#ordersList>*,#cartItems>*):nth-child(6n+4){--bc:var(--c4)}
:is(.products-grid>*,.categories-grid>*,.marquee-track>*,.benefits>*,.features>*,.stats-grid>*,.admin-list>*,.pd-perks>*,#ordersList>*,#cartItems>*):nth-child(6n+5){--bc:var(--c5)}
:is(.products-grid>*,.categories-grid>*,.marquee-track>*,.benefits>*,.features>*,.stats-grid>*,.admin-list>*,.pd-perks>*,#ordersList>*,#cartItems>*):nth-child(6n+6){--bc:var(--c6)}

.ord-back{
 display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 4px;
 background:none;border:0;color:var(--text);font-size:14px;font-weight:800;
}
.ord-back:hover{color:var(--cyan)}
.ord-box{
 padding:18px;border-radius:18px;background:var(--panel2);
 border:1.5px solid var(--border);margin-bottom:14px;
}
.ord-box h3{font-size:16px;font-weight:900;margin-bottom:14px}
.od-label{font-size:11px;color:var(--muted)}
.od-no{font-size:24px;font-weight:900;direction:ltr;unicode-bidi:isolate;text-align:right}
.od-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.od-banner{
 display:flex;align-items:center;gap:10px;margin-top:16px;padding:14px;border-radius:12px;
 font-size:13px;font-weight:800;color:var(--sc);
 background:color-mix(in srgb,var(--sc) 12%,transparent);
 border:1px solid color-mix(in srgb,var(--sc) 40%,transparent);
}
.od-track{display:flex;justify-content:space-between;margin-top:18px;position:relative}
.od-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
 font-size:10px;font-weight:700;color:var(--muted);text-align:center;position:relative;z-index:1}
.od-step i{
 width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;
 background:var(--bg);border:2px solid var(--border);font-size:13px;
}
.od-step.done{color:var(--text)}
.od-step.done i{background:var(--success);border-color:var(--success);color:#04251a}
.od-step.now i{box-shadow:0 0 0 4px #24d69a33}
.od-step:not(:last-child):after{
 content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--border);z-index:-1;
}
.od-step.done:not(:last-child):after{background:var(--success)}
.od-it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.od-it:last-of-type{border-bottom:0}
.od-it .ord-th{width:64px;height:64px}
.od-in{flex:1;min-width:0}
.od-in b{display:block;font-size:13px;line-height:1.7}
.od-in small{color:var(--muted);font-size:11px;direction:ltr;unicode-bidi:isolate;display:inline-block}
.od-line{font-weight:900;font-size:14px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.od-sum{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.od-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-size:13px}
.od-row span:first-child{color:var(--muted)}
.od-row strong{direction:ltr;unicode-bidi:isolate;font-weight:800}
.od-row.total{font-size:15px;border-top:1px dashed var(--border);margin-top:4px;padding-top:14px}
.od-row.total strong{font-size:20px;color:var(--cyan)}
.od-info{display:flex;align-items:flex-start;gap:12px;padding:10px 0;font-size:13px;line-height:1.8}
.od-info .ic{
 width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
 background:var(--bg);border:1px solid var(--border);font-size:16px;
}
.od-info small{display:block;color:var(--muted);font-size:10px}
.od-info b{font-weight:700;word-break:break-word}
.od-pay{
 display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;
 background:var(--bg);border:1px solid var(--border);font-size:13px;font-weight:800;
}
.od-pay small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:3px;line-height:1.8}
.od-note{margin-top:10px;padding:12px;border-radius:10px;font-size:12px;line-height:1.9;font-weight:700;
 color:#ffd978;background:#4a3a0e55;border:1px solid #ffb02055}
body.light .od-note{color:#8a5a00;background:#fff4d6}
@media(max-width:450px){
 .ord-title{font-size:22px}.od-no{font-size:20px}.od-step{font-size:9px}
}

/* ===== صفحة حسابي ===== */
.acc-title{font-size:30px;font-weight:900;margin:4px 0 16px}
.acc-card{padding:18px;border-radius:18px;background:var(--panel2);border:1.5px solid var(--border);margin-bottom:14px}
.acc-profile{display:flex;align-items:center;gap:14px}
.acc-av{width:64px;height:64px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:28px;
 background:#087bff22;border:1.5px solid var(--c1)}
.acc-pi{min-width:0;flex:1}
.acc-pi h3{font-size:18px;font-weight:900;margin-bottom:4px}
.acc-pi small{display:block;color:var(--muted);font-size:12px;word-break:break-all;direction:ltr;text-align:right}
.acc-role{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 12px;border-radius:20px;
 font-size:11px;font-weight:800;color:var(--cyan);background:#00d9ff1a;border:1px solid var(--c1)}
.acc-sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.acc-sec h3{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.acc-edit{padding:7px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:800}
.acc-edit:hover{border-color:var(--c1)}
.acc-addr{font-size:13px;line-height:2;color:var(--muted)}
.acc-addr b{color:var(--text);font-weight:800;display:block}
.acc-addr .ph{direction:ltr;text-align:right;unicode-bidi:isolate}
.acc-menu{border-radius:18px;background:var(--panel2);border:1.5px solid var(--border);overflow:hidden;margin-bottom:14px}
.acc-row{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;border-bottom:1px solid var(--border);
 background:none;color:var(--text);text-align:right}
.acc-row:last-child{border-bottom:0}
.acc-row:hover{background:var(--bg)}
.acc-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex-shrink:0;
 background:#087bff1f;border:1px solid var(--border)}
.acc-rt{flex:1}
.acc-rt b{display:block;font-size:15px;font-weight:900}
.acc-rt small{color:var(--muted);font-size:12px}
.acc-ar{color:var(--muted);font-size:20px}
.acc-perk h3{font-size:14px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.acc-perk p{font-size:12px;color:var(--muted);line-height:1.9}
.acc-out{width:100%;padding:15px;border-radius:14px;border:1.5px solid var(--border);background:var(--panel2);
 color:#ff6b81;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.acc-out:hover{border-color:var(--danger)}
.acc-saved-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.8}

/* الأسعار والأرقام باللون الأسود */
.ord-price,.od-row.total strong,.od-line,.ord-no,.od-no,.od-row strong{
 color:var(--num);-webkit-text-fill-color:var(--num)}
.cp-price,.cp-price em,.cp-qty span,.cart-panel #cartTotal,.co-item strong,.co-tr strong{
 color:#000;-webkit-text-fill-color:#000}
.co-item strong,.co-tr strong{font-weight:900}
.stat-card strong,.pill{font-variant-numeric:tabular-nums}

/* ===== شاشة نجاح الطلب ===== */
.done-page{display:none;position:fixed;inset:0;z-index:120;background:var(--bg);overflow-y:auto;padding:30px 16px 50px}
.done-page.show{display:block}
.done-in{max-width:560px;margin:0 auto;text-align:center}
.done-ic{width:104px;height:104px;border-radius:50%;margin:30px auto 18px;display:grid;place-items:center;font-size:48px;
 background:#087bff22;border:1.5px solid var(--c1);box-shadow:0 0 40px #00d9ff22}
.done-in h2{font-size:30px;font-weight:900;margin-bottom:8px}
.done-in>p{font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:22px}
.done-card{text-align:right;padding:20px;border-radius:20px;background:var(--panel2);border:1.5px solid var(--border);margin-bottom:18px}
.done-no{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:6px}
.done-no small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.done-no b{font-size:30px;font-weight:900;color:var(--num);direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:1px}
.done-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;font-size:14px}
.done-row+.done-row{border-top:1px solid var(--border)}
.done-row span{color:var(--muted);display:flex;align-items:center;gap:7px}
.done-row strong{font-weight:900;color:var(--num);direction:ltr;unicode-bidi:isolate}
.done-row strong.rtl{direction:rtl}
.done-note{margin-top:8px;padding:13px;border-radius:12px;background:var(--bg);border:1px solid var(--border);
 font-size:12px;line-height:2;color:var(--muted);font-weight:700}
.done-btn{width:100%;padding:16px;border-radius:14px;border:0;font-size:15px;font-weight:900;margin-bottom:10px}
.done-btn.main{background:linear-gradient(135deg,#19c3ff,#0a8fe0);color:#04162a}
.done-btn.sec{background:var(--panel2);border:1.5px solid var(--border);color:var(--text)}

/* شارات الإدارة */
.nav-btn .nav-badge.red{background:#ff2d46;color:#fff;-webkit-text-fill-color:#fff;left:calc(50% + 2px);top:-4px}
.admin-tab .pill.red{background:#ff2d46;color:#fff}

/* ===== نظرة عامة: المخزون ===== */
.ov-sec{margin-top:16px;padding:16px;border-radius:18px;background:var(--panel2);border:1.5px solid var(--sc,var(--border))}
.ov-sec.warn{--sc:#ffb020}.ov-sec.bad{--sc:#ff5d73}
.ov-hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ov-hic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex-shrink:0;
 background:color-mix(in srgb,var(--sc) 16%,transparent);border:1px solid color-mix(in srgb,var(--sc) 50%,transparent)}
.ov-hd h3{font-size:15px;font-weight:900}
.ov-hd small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.ov-cnt{margin-inline-start:auto;min-width:34px;height:34px;padding:0 10px;border-radius:20px;display:grid;place-items:center;
 font-size:14px;font-weight:900;color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent);border:1px solid color-mix(in srgb,var(--sc) 45%,transparent)}
.ov-list{display:grid;gap:9px}
.ov-row{display:flex;align-items:center;gap:12px;padding:11px;border-radius:14px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:.2s}
.ov-row:hover{border-color:var(--sc);transform:translateY(-1px)}
.ov-info{flex:1;min-width:0}
.ov-info h4{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-info small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.ov-bar{height:6px;border-radius:6px;background:var(--border);margin-top:8px;overflow:hidden}
.ov-bar i{display:block;height:100%;border-radius:6px;background:var(--sc)}
.ov-side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
.ov-qty{font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent)}
.ov-add{padding:7px 12px;border-radius:10px;border:1.5px solid var(--sc);background:none;color:var(--text);font-size:11px;font-weight:800}
.ov-add:hover{background:var(--sc);color:#000}
.ov-empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:13px;font-weight:700}
.ov-empty span{display:block;font-size:30px;margin-bottom:6px}
/* المُلّاك */
.own-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--border)}
.own-av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffc52e22;border:1px solid var(--c4);font-size:19px;flex-shrink:0}
.own-em{flex:1;min-width:0;font-size:13px;font-weight:800;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis}
.own-row small{display:block;color:var(--muted);font-size:10px;font-weight:600;direction:rtl}
.own-del{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--danger);background:#451b2b;font-size:17px;flex-shrink:0}
.own-del:hover{background:var(--danger)}

/* أزرار الطلبات بألوان مختلفة */
.act-sel{border-color:#3da5ff!important;background:#3da5ff1f!important;color:var(--text)}
.secondary-btn.act-save{border-color:#24d69a;background:#24d69a1f}
.secondary-btn.act-save:hover{background:#24d69a;border-color:#24d69a;color:#04251a}
.secondary-btn.act-det{border-color:#a58bff;background:#a58bff1f}
.secondary-btn.act-det:hover{background:#a58bff;border-color:#a58bff;color:#fff}
.act-sel,.secondary-btn.act-save,.secondary-btn.act-det{padding:11px 14px;border-radius:11px;border-width:2px;border-style:solid}
/* رسالة المُلّاك */
.own-note{display:flex;align-items:center;gap:12px;margin:12px 0;padding:14px 16px;border-radius:16px;
 background:linear-gradient(135deg,#24d69a22,#087bff22);border:1.5px solid #24d69a88;animation:toastIn .3s ease}
.own-note.del{background:linear-gradient(135deg,#a58bff22,#ff4d8d22);border-color:#a58bff88}
.own-note.err{background:#451b2b;border-color:var(--danger)}
.own-note .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex-shrink:0;background:#ffffff14}
.own-note b{display:block;font-size:14px;font-weight:900}
.own-note small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.8}
.own-nm{font-size:14px;font-weight:900;direction:rtl;text-align:right}
.own-em2{font-size:11px;color:var(--muted);direction:ltr;text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis}
/* صفحة تفاصيل الطلب للإدارة */
.adm-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.adm-grid{grid-template-columns:1fr 1fr}}
.od-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.od-act{padding:7px 14px;border-radius:10px;font-size:11px;font-weight:900;border:1.5px solid var(--c1);color:var(--text);background:#00d9ff14}
.od-act.wa{border-color:#24d69a;background:#24d69a14}
.adm-status{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.adm-status select{flex:1;min-width:150px}
.wi{width:1.25em;height:1.25em;flex-shrink:0;display:inline-block;vertical-align:-.25em}
.od-act{display:inline-flex;align-items:center;gap:6px}
.od-act .wi{width:15px;height:15px;vertical-align:middle}
.od-act.wa .wi{color:#25D366}
/* تواصل معنا */
.contact-sec{margin:30px 0 10px}
.contact-btns{display:flex;flex-wrap:wrap;gap:12px}
.ct-btn{
 flex:1 1 260px;display:flex;align-items:center;justify-content:center;gap:12px;
 padding:15px 26px;border-radius:999px;border:3px solid var(--ctb);background:var(--ctf);
 color:#fff;font-weight:900;font-size:15px;box-shadow:0 6px 18px color-mix(in srgb,var(--ctb) 40%,transparent);
 transition:transform .15s,filter .15s,box-shadow .2s;
}
.ct-btn .wi{width:28px;height:28px}
.ct-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.ct-btn:active{transform:scale(.97)}
.ct-wa{--ctb:#128c4a;--ctf:#25d366}
.ct-ig{--ctb:#8a3ab9;--ctf:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.ct-fb{--ctb:#0a58c9;--ctf:#1877f2}
/* نوافذ الإدارة الاحترافية */
.pm-ov{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;padding:16px;
 background:#000b;backdrop-filter:blur(8px);animation:pmFade .25s ease}
.pm-card{width:min(440px,100%);border-radius:26px;overflow:hidden;background:var(--panel);color:var(--text);
 border:1.5px solid var(--border);box-shadow:0 30px 80px #000a;animation:pmUp .35s cubic-bezier(.2,1.2,.4,1)}
.pm-top{padding:30px 20px 22px;text-align:center;background:linear-gradient(135deg,var(--pc1),var(--pc2))}
.pm-ic{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#fff;
 background:#ffffff26;border:2px solid #ffffff66;box-shadow:0 0 0 8px #ffffff14}
.pm-top h3{font-size:20px;font-weight:900;color:#fff}
.pm-top p{font-size:12px;color:#ffffffd9;margin-top:5px;font-weight:700}
.pm-body{padding:20px}
.pm-user{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--border);margin-bottom:14px}
.pm-user .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffc52e22;border:1px solid var(--c4);font-size:19px;flex-shrink:0}
.pm-user b{display:block;font-size:14px;font-weight:900}
.pm-user small{display:block;font-size:11px;color:var(--muted);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis}
.pm-list{display:grid;gap:9px;margin-bottom:14px}
.pm-list div{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;line-height:1.8;font-weight:700}
.pm-list i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0;
 color:#04251a;background:var(--success)}
.pm-meta{font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px;font-weight:700}
.pm-btns{display:flex;gap:10px}
.pm-btn{flex:1;padding:14px;border-radius:14px;border:0;font-size:14px;font-weight:900;color:#fff;
 background:linear-gradient(135deg,var(--pc1),var(--pc2))}
.pm-btn.sec{background:var(--panel2);border:1.5px solid var(--border);color:var(--text)}
.pm-ok{--pc1:#24d69a;--pc2:#087bff}
.pm-warn{--pc1:#ff5364;--pc2:#a600ff}
@keyframes pmFade{from{opacity:0}to{opacity:1}}
@keyframes pmUp{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
/* تعديلات: تواصل معنا + أزرار كبسولة */
.ct-head{justify-content:center;text-align:center}
.contact-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ct-btn{flex:none;padding:13px 16px;font-size:13.5px;min-height:60px;line-height:1.5;text-align:center;gap:10px;white-space:normal;word-break:keep-all}
.ct-btn .wi{width:26px;height:26px}
@media(max-width:900px){.ct-btn{font-size:12.5px;padding:12px 13px;gap:8px}.ct-btn .wi{width:23px;height:23px}}
@media(max-width:650px){.contact-btns{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ct-btn{font-size:12px;padding:12px 10px;gap:7px;min-height:56px}}
@media(max-width:360px){.contact-btns{grid-template-columns:1fr}}
.primary-btn,.checkout-btn,.secondary-btn,.danger-btn,.done-btn,.google-btn,.acc-out,.acc-edit,.auth-tab,.admin-tab,.search-row button,.ov-add,.hero-btn,.add-btn,.co-btn,.cp-btn,.pm-btn,.od-act{border-radius:999px}
.od-act{border:2px solid #0a45b8;background:#1d6bff;color:#fff;padding:8px 16px}
.od-act .wi{color:#fff}
.od-act.wa{border-color:#128c4a;background:#25d366}
.od-act.wa .wi{color:#fff}
/* الصورة الرئيسية تظهر كاملة على كل الشاشات */
.hero img{max-height:none;height:auto;object-fit:contain}
.hero-preview{max-height:none;object-fit:contain}
/* كل الأزرار كبسولة */
.ord-back,.acc-row,.qty-controls .remove-btn,.order-status,.act-sel{border-radius:999px}
.order-status,.act-sel{padding-inline:14px}
.ord-back{padding:8px 16px}
.category-btn{border-radius:26px}
/* مساعد نسر البرية الذكي */
.ai-fab{
 position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:36;
 display:flex;align-items:center;gap:9px;padding:6px 18px 6px 7px;border-radius:999px;
 border:3px solid #5b1fb5;background:#8b3dff;color:#fff;font-weight:900;font-size:13px;
 box-shadow:0 8px 24px #8b3dff77;animation:aiPulse 2.8s ease-in-out infinite;
}
.ai-fab:hover{filter:brightness(1.1)}
.ai-fab-ic{
 width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
 background:radial-gradient(circle at 30% 25%,#3a1480,#0d0620);border:2px solid #e9d5ff;
}
.ai-fab-ic svg{width:30px;height:30px;display:block}

@media(prefers-reduced-motion:reduce){.ai-fab{animation:none}}
.ai-page{display:none;position:fixed;inset:0;z-index:130;background:var(--bg);flex-direction:column;direction:rtl}

 color:var(--text);font-size:12px;font-weight:800;white-space:nowrap;
}

.ai-form{

 background:var(--panel);border-top:2px solid #8b3dff;
}

}

/* ===== تعديلات الجولة الأخيرة ===== */

@media(min-width:1100px){

}
/* صفحة المساعد: بوابة الاسم وأزرار دائرية */

}

.ai-gate-in label{display:block;text-align:right;font-size:14px;font-weight:900;margin-bottom:8px}
.ai-gate-in input{
 width:100%;padding:15px 20px;border-radius:999px;border:2px solid #8b3dff;background:var(--panel2);
 color:var(--text);font-size:16px;font-weight:700;outline:none;text-align:right;
}

.ai-gate-btn{

 background:#8b3dff;color:#fff;font-size:16px;font-weight:900;
}
.ai-gate-btn:hover{filter:brightness(1.1)}
@keyframes aiShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ai-round{
 width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;padding:0;
 border:3px solid #5b1fb5;background:#8b3dff;color:#fff;
}

/* ===== شعار النسر الجديد + عدّاد الكمية العريض ===== */

}

.qty-cap button{width:38px;height:36px;font-size:19px}
.add-row{flex-wrap:wrap}
.add-row .qty-cap{flex:1 1 100%;width:100%;justify-content:space-between}

.forgot-link{display:block;color:#1d6bff!important;font-weight:800;margin:2px 0 12px;padding:4px 2px}

/* ===== صفحات نسيت/تعيين كلمة المرور ===== */
.rs-page{display:none;position:fixed;inset:0;z-index:140;background:#fff;overflow-y:auto;direction:rtl;color:#111}

.rs-brand.big{font-size:46px}
